name: Feature request
description: Suggest an idea for JARVIS Music
title: "[Feature]: "
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Thanks for sharing an idea! Please describe what you'd like to see."
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or gap?
      description: What are you trying to do that the app doesn't currently support?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - Backend API
        - Build / Packaging
        - Other
